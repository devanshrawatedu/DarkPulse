[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkpulse"
version = "2.0.0"
description = "DarkPulse - automated threat intelligence & leak analytics platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5,<3",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    "networkx>=3.1,<4",
    "feedparser>=6.0,<7",
    "python-dateutil>=2.8,<3",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]
nlp = ["spacy>=3.7,<4"]
mongo = ["pymongo>=4.6,<5"]
neo4j = ["neo4j>=5.14,<7"]
dev = ["pytest>=8.0,<10"]

[project.scripts]
darkpulse = "darkpulse.cli:main"

[tool.setuptools.packages.find]
include = ["darkpulse*"]

[tool.setuptools.package-data]
darkpulse = [
    "fixtures/*.json",
    "web/static/*.html",
    "web/static/*.css",
    "web/static/*.js",
    "web/static/vendor/*.js",
    "web/static/vendor/*.css",
    "web/static/vendor/*.txt",
    "web/static/vendor/fonts/*.woff2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
