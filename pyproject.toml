[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkpulse"
version = "0.1.0"
description = "DarkPulse - automated threat intelligence & leak analytics platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5,<3",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    "networkx>=3.1,<4",
    "feedparser>=6.0,<7",
    "python-dateutil>=2.8,<3",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.32,<2",
    "pandas>=2.0,<3",
    "pyvis>=0.3.2,<1",
]
nlp = ["spacy>=3.7,<4"]
mongo = ["pymongo>=4.6,<5"]
neo4j = ["neo4j>=5.14,<7"]
dev = ["pytest>=8.0,<10"]

[project.scripts]
darkpulse = "darkpulse.cli:main"

[tool.setuptools.packages.find]
include = ["darkpulse*"]

[tool.setuptools.package-data]
darkpulse = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
