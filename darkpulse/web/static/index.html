<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DarkPulse — Threat Intelligence Command Center</title>
  <meta name="description" content="DarkPulse correlates vulnerabilities, malware, threat actors and incidents across public sources." />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2306080d'/%3E%3Cpath d='M16 5l9 4v7c0 6-4 9-9 11-5-2-9-5-9-11V9l9-4z' fill='none' stroke='%2338e1d0' stroke-width='2'/%3E%3Ccircle cx='16' cy='15' r='2.6' fill='%23ff5d7a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/vendor/fonts.css" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <!-- First-run / loading state: painted instantly, never a blank page -->
  <div class="boot" id="boot">
    <div class="boot-inner">
      <div class="boot-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M24 4l16 7v12c0 11-7 16-16 21C15 39 8 34 8 23V11l16-7z" stroke="currentColor" stroke-width="1.6" />
          <circle cx="24" cy="22" r="4" fill="currentColor" />
          <circle cx="24" cy="22" r="9" stroke="currentColor" stroke-width="1" opacity=".45" />
          <circle cx="24" cy="22" r="14" stroke="currentColor" stroke-width="1" opacity=".18" />
        </svg>
      </div>
      <div class="boot-word">DARK<span>PULSE</span></div>
      <p class="boot-sub" id="boot-sub">Starting the analysis engine…</p>
      <div class="boot-bar"><span id="boot-bar-fill"></span></div>
      <p class="boot-hint" id="boot-hint">First run parses the bundled fixtures. Live collection can take a minute.</p>
      <div class="boot-error" id="boot-error" hidden>
        <p id="boot-error-text"></p>
        <button class="btn btn-primary" id="boot-retry">Retry pipeline</button>
      </div>
    </div>
  </div>

  <div class="shell" id="shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#/overview">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M24 4l16 7v12c0 11-7 16-16 21C15 39 8 34 8 23V11l16-7z" stroke="currentColor" stroke-width="2" />
            <circle cx="24" cy="22" r="4" fill="currentColor" />
            <circle cx="24" cy="22" r="9" stroke="currentColor" stroke-width="1.2" opacity=".45" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>DARKPULSE</strong>
          <em>threat intelligence</em>
        </span>
      </a>

      <nav class="nav" id="nav" aria-label="Views">
        <a class="nav-item" href="#/overview" data-view="overview">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.6"/></svg></span>
          <span>Overview</span>
        </a>
        <a class="nav-item" href="#/alerts" data-view="alerts">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8 4.5v6c0 4.5-3.4 7-8 8.5-4.6-1.5-8-4-8-8.5v-6L12 3z" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v4.5M12 16h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          <span>Priority alerts</span>
          <span class="nav-count mono" id="nav-alerts-count">—</span>
        </a>
        <a class="nav-item" href="#/graph" data-view="graph">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="7" r="2.6" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="6" r="2.6" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="17" r="2.6" stroke="currentColor" stroke-width="1.6"/><path d="M8.3 8.4l6.6-1M7.5 9.3l3.4 5.5M16.6 8.3l-3.3 6.3" stroke="currentColor" stroke-width="1.4"/></svg></span>
          <span>Relationship graph</span>
        </a>
        <a class="nav-item" href="#/trends" data-view="trends">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 17l5-6 4 3 5-7 4 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 21h18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
          <span>Threat trends</span>
          <span class="nav-count mono" id="nav-spikes-count">—</span>
        </a>
        <a class="nav-item" href="#/records" data-view="records">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
          <span>Source inspector</span>
        </a>
      </nav>

      <div class="sidebar-panel">
        <div class="panel-label">Dataset</div>
        <div class="mode-row">
          <span class="mode-dot" id="mode-dot"></span>
          <span id="mode-label">Connecting…</span>
        </div>
        <div class="sidebar-meta mono" id="sidebar-meta">—</div>
        <button class="btn btn-ghost btn-block" id="refresh-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Refresh run
        </button>
      </div>

      <div class="sidebar-foot">
        <span class="mono" id="version-label">v2</span>
        <span class="mono" id="clock">--:--:--</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-label="Open navigation">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar-titles">
          <span class="eyebrow" id="page-eyebrow">Command center</span>
          <h1 id="page-title">Overview</h1>
        </div>
        <div class="topbar-tools">
          <div class="searchbox" id="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <input id="global-search" type="search" placeholder="Search entities or CVEs…" autocomplete="off" spellcheck="false" aria-label="Search entities or CVEs" />
            <kbd>/</kbd>
            <div class="search-results" id="search-results" hidden></div>
          </div>
          <div class="run-state" id="run-state">
            <span class="run-dot"></span>
            <span id="run-state-label">Ready</span>
          </div>
        </div>
      </header>

      <div id="banner" class="banner-wrap"></div>

      <main class="content" id="content">
        <section class="view" id="view-overview" data-view="overview"></section>
        <section class="view" id="view-alerts" data-view="alerts" hidden></section>
        <section class="view" id="view-graph" data-view="graph" hidden></section>
        <section class="view" id="view-trends" data-view="trends" hidden></section>
        <section class="view" id="view-records" data-view="records" hidden></section>
      </main>
    </div>
  </div>

  <noscript>
    <div class="boot">
      <div class="boot-inner">
        <div class="boot-word">DARK<span>PULSE</span></div>
        <p class="boot-sub">This dashboard needs JavaScript. Enable it and reload.</p>
      </div>
    </div>
  </noscript>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Detail panel" aria-live="polite"></aside>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
